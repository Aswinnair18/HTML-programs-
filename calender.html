<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple HTML Calendar</title>
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9;">

    <!-- Calendar Container Table -->
    <table border="1" cellpadding="10" cellspacing="0" style="border-collapse: collapse; background-color: #ffffff; box-shadow: 0px 4px 8px rgba(0,0,0,0.1); text-align: center; border-color: #dddddd;">
        
        <!-- Month and Year Header -->
        <thead>
            <tr style="background-color: #4CAF50; color: white;">
                <th colspan="7" style="padding: 15px; font-size: 1.2rem; letter-spacing: 1px;">
                    OCTOBER 2026
                </th>
            </tr>
            <!-- Days of the Week Header -->
            <tr style="background-color: #f2f2f2; color: #333;">
                <th style="width: 40px; color: #e91e63;">Sun</th>
                <th style="width: 40px;">Mon</th>
                <th style="width: 40px;">Tue</th>
                <th style="width: 40px;">Wed</th>
                <th style="width: 40px;">Thu</th>
                <th style="width: 40px;">Fri</th>
                <th style="width: 40px;">Sat</th>
            </tr>
        </thead>

        <!-- Calendar Dates -->
        <tbody>
            <tr>
                <!-- Empty cells for days before the 1st of the month (Oct 2026 starts on a Thursday) -->
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td style="color: #e91e63;">4</td>
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td>10</td>
            </tr>
            <tr>
                <td style="color: #e91e63;">11</td>
                <td>12</td>
                <td>13</td>
                <td>14</td>
                <td>15</td>
                <td>16</td>
                <td>17</td>
            </tr>
            <tr>
                <td style="color: #e91e63;">18</td>
                <td>19</td>
                <td>20</td>
                <td>21</td>
                <td>22</td>
                <td>23</td>
                <td>24</td>
            </tr>
            <tr>
                <td style="color: #e91e63;">25</td>
                <td>26</td>
                <td>27</td>
                <td>28</td>
                <td>29</td>
                <td>30</td>
                <td>31</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
