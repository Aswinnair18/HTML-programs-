<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Integration Techniques</title>
<!-- 1. External Style Sheet -->
<link rel="stylesheet" href="styles.css">
<!-- 2. Internal Style Sheet -->
<style>
.internal-rule {
color: #166534;
background-color: #dcfce7;
padding: 10px;
border-left: 4px solid #15803d;
}
</style>
</head>
<body>
<!-- External Style Demonstration -->
<p class="external-rule">Styled using an external stylesheet (styles.css).</p>
<!-- Internal Style Demonstration -->
<p class="internal-rule">Styled using internal &lt;style&gt; tags in the document
head.</p>
<!-- 3. Inline Style Demonstration -->
<p style="color: #991b1b; background-color: #fee2e2; padding: 10px; border-left:
4px solid #b91c1c;">
Styled using an inline style attribute directly on the tag.
</p>
</body>
</html>
